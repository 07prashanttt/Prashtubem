<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamTube Unlimited — Live YouTube Search & Stream</title>
  <style>
    :root {
      --bg: #0b0d12;
      --surface: #141821;
      --surface-2: #1c2230;
      --text: #f3f6fc;
      --muted: #9aa4b8;
      --accent: #ff2e4d;
      --accent-2: #3b82f6;
      --border: rgba(255, 255, 255, 0.09);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11, 13, 18, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.25rem;
      font-weight: 800;
    }

    .brand-badge {
      background: var(--accent);
      color: #fff;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
    }

    .search-box {
      flex: 1 1 300px;
      max-width: 520px;
      display: flex;
      gap: 8px;
    }

    input, button {
      font: inherit;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      outline: none;
    }

    input { width: 100%; }
    input:focus { border-color: var(--accent-2); }

    button { cursor: pointer; font-weight: 600; transition: 0.15s; }
    button:hover { opacity: 0.9; }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      white-space: nowrap;
    }

    .btn-ghost { background: var(--surface-2); }

    .container {
      max-width: 1360px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      gap: 22px;
    }

    .api-banner {
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.35);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      font-size: 0.9rem;
    }

    .api-banner input {
      max-width: 320px;
      padding: 8px 12px;
      font-size: 0.85rem;
    }

    .player-section {
      display: grid;
      grid-template-columns: 2.2fr 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 960px) {
      .player-section { grid-template-columns: 1fr; }
    }

    .player-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    .video-frame-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .video-frame-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .player-meta {
      padding: 16px 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .player-title { font-size: 1.15rem; font-weight: 700; }
    .player-sub { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

    .queue-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 540px;
      overflow-y: auto;
    }

    .filters { display: flex; flex-wrap: wrap; gap: 8px; }

    .chip {
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .chip.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.16s ease;
    }

    .card:hover { transform: translateY(-3px); }

    .thumb-wrap {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #0f131a;
      cursor: pointer;
    }

    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .card-title {
      font-size: 0.94rem;
      font-weight: 700;
      line-height: 1.35;
      cursor: pointer;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-cat { font-size: 0.78rem; color: var(--muted); }

    .card-actions {
      margin-top: auto;
      padding-top: 8px;
      display: flex;
      gap: 8px;
    }

    .card-actions button { flex: 1; padding: 8px 10px; font-size: 0.82rem; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>StreamTube</span>
      <span class="brand-badge">UNLIMITED</span>
    </div>

    <div class="search-box">
      <input id="searchInput" type="search" placeholder="Search ANY YouTube video, movie, song, or paste link..." />
      <button id="searchBtn" class="btn-primary">Search</button>
    </div>

    <button id="toggleSavedBtn" class="btn-ghost">Saved (0)</button>
  </header>

  <main class="container">
    <!-- API Key Setup Bar -->
    <section class="api-banner" id="apiBanner">
      <div>
        <strong>YouTube Live Search Mode:</strong> Unlimited YouTube videos search karne ke liye apni free <b>YouTube Data API v3 Key</b> daalein (browser mein safe save hogi).
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <input id="apiKeyInput" type="password" placeholder="Paste AIzaSy... API Key here" />
        <button id="saveApiBtn" class="btn-primary">Save Key</button>
      </div>
    </section>

    <!-- Player + Up Next -->
    <section class="player-section">
      <div class="player-card">
        <div class="video-frame-wrap">
          <iframe
            id="ytPlayer"
            src=""
            title="YouTube Player"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
          ></iframe>
        </div>
        <div class="player-meta">
          <div>
            <div id="nowTitle" class="player-title">Ready to Stream</div>
            <div id="nowMeta" class="player-sub">Search anything above or paste a YouTube URL</div>
          </div>
          <div style="display:flex; gap:8px;">
            <button id="saveCurrentBtn" class="btn-ghost">Save Video</button>
            <a id="openYtLink" href="https://youtube.com" target="_blank" rel="noopener noreferrer">
              <button type="button" class="btn-ghost">Open on YouTube</button>
            </a>
          </div>
        </div>
      </div>

      <aside class="queue-panel">
        <div style="font-weight:700; display:flex; justify-content:space-between;">
          <span>Up Next / Results</span>
          <span id="queueCount" style="color:var(--muted); font-size:0.82rem;"></span>
        </div>
        <div id="upNextList" style="display:flex; flex-direction:column; gap:10px;"></div>
      </aside>
    </section>

    <!-- Quick Topic Chips -->
    <section class="filters" id="filterBar"></section>

    <!-- Video Grid -->
    <section class="grid" id="catalogGrid"></section>
  </main>

  <script>
    const SAVED_KEY = "streamtube_saved_v2";
    const API_STORAGE_KEY = "streamtube_yt_api_key";

    const QUICK_TOPICS = [
      "Trending Movies & Trailers",
      "Bollywood Hit Songs",
      "IPL & Cricket Highlights",
      "South Hindi Dubbed Full Movie",
      "4K Nature & Travel",
      "Lofi Beats Live",
      "Tech Reviews & Gaming"
    ];

    const FALLBACK_VIDEOS = [
      { id: "aqz-KE-bpKQ", title: "Big Buck Bunny 60fps 4K Showcase", channel: "Blender Foundation" },
      { id: "LXb3EKWsInQ", title: "Costa Rica in 4K 60fps HDR", channel: "Jacob + Katie Schwarz" },
      { id: "jfKfPfyJRdk", title: "lofi hip hop radio - beats to relax/study to", channel: "Lofi Girl" },
      { id: "EngW7tLk6R8", title: "Cinematic Drone Aerials 4K", channel: "4K Relaxation" }
    ];

    let state = {
      apiKey: localStorage.getItem(API_STORAGE_KEY) || "",
      videos: [...FALLBACK_VIDEOS],
      savedVideos: loadSaved(),
      currentVideo: FALLBACK_VIDEOS[0],
      showSavedOnly: false,
      activeTopic: QUICK_TOPICS[0]
    };

    const els = {
      apiKeyInput: document.getElementById("apiKeyInput"),
      saveApiBtn: document.getElementById("saveApiBtn"),
      searchInput: document.getElementById("searchInput"),
      searchBtn: document.getElementById("searchBtn"),
      ytPlayer: document.getElementById("ytPlayer"),
      nowTitle: document.getElementById("nowTitle"),
      nowMeta: document.getElementById("nowMeta"),
      openYtLink: document.getElementById("openYtLink"),
      saveCurrentBtn: document.getElementById("saveCurrentBtn"),
      toggleSavedBtn: document.getElementById("toggleSavedBtn"),
      filterBar: document.getElementById("filterBar"),
      catalogGrid: document.getElementById("catalogGrid"),
      upNextList: document.getElementById("upNextList"),
      queueCount: document.getElementById("queueCount")
    };

    function loadSaved() {
      try {
        const data = JSON.parse(localStorage.getItem(SAVED_KEY) || "[]");
        return Array.isArray(data) ? data : [];
      } catch {
        return [];
      }
    }

    function persistSaved() {
      localStorage.setItem(SAVED_KEY, JSON.stringify(state.savedVideos));
      updateSavedUI();
    }

    function updateSavedUI() {
      els.toggleSavedBtn.textContent = `Saved (${state.savedVideos.length})`;
      const isSaved = state.currentVideo && state.savedVideos.some(v => v.id === state.currentVideo.id);
      els.saveCurrentBtn.textContent = isSaved ? "Saved ✓" : "Save Video";
    }

    function extractYouTubeId(input) {
      const trimmed = (input || "").trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;
      try {
        const url = new URL(trimmed);
        if (url.hostname.includes("youtu.be")) {
          const id = url.pathname.replace("/", "").split("/")[0];
          return /^[a-zA-Z0-9_-]{11}$/.test(id) ? id : null;
        }
        if (url.hostname.includes("youtube.com")) {
          const v = url.searchParams.get("v");
          if (v && /^[a-zA-Z0-9_-]{11}$/.test(v)) return v;
          const parts = url.pathname.split("/").filter(Boolean);
          const idx = parts.findIndex(p => ["embed", "shorts", "live"].includes(p));
          if (idx !== -1 && parts[idx + 1] && /^[a-zA-Z0-9_-]{11}$/.test(parts[idx + 1])) {
            return parts[idx + 1];
          }
        }
      } catch {}
      return null;
    }

    async function searchYouTube(query) {
      const directId = extractYouTubeId(query);
      if (directId) {
        playVideo({ id: directId, title: `Direct YouTube Video (${directId})`, channel: "Direct Link" }, true);
        return;
      }

      if (!state.apiKey) {
        els.catalogGrid.innerHTML = `<p style="color:#fda4af; grid-column:1/-1;">Unlimited search ke liye upar box mein apni free <b>YouTube Data API v3 Key</b> save karein, ya seedha koi YouTube link paste karke Search dabayein.</p>`;
        return;
      }

      els.catalogGrid.innerHTML = `<p style="color:var(--muted); grid-column:1/-1;">Searching YouTube for "${query}"...</p>`;

      try {
        const endpoint = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=24&q=${encodeURIComponent(query)}&key=${encodeURIComponent(state.apiKey)}`;
        const res = await fetch(endpoint);
        const data = await res.json();

        if (data.error) {
          els.catalogGrid.innerHTML = `<p style="color:#fda4af; grid-column:1/-1;">API Error: ${data.error.message}</p>`;
          return;
        }

        state.showSavedOnly = false;
        state.videos = (data.items || []).map(item => ({
          id: item.id.videoId,
          title: item.snippet.title,
          channel: item.snippet.channelTitle
        }));

        renderCatalog();
        renderUpNext();
      } catch (err) {
        els.catalogGrid.innerHTML = `<p style="color:#fda4af; grid-column:1/-1;">Network error aaya. Internet ya API key check karein.</p>`;
      }
    }

    function playVideo(video, autoplay = true) {
      if (!video || !
