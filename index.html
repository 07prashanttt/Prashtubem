<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamTube 4K — Direct YouTube Streaming Hub</title>
  <style>
    :root {
      --bg: #0b0d12;
      --surface: #141821;
      --surface-2: #1c2230;
      --text: #f3f6fc;
      --muted: #9aa4b8;
      --accent: #ff2e4d;
      --accent-2: #3b82f6;
      --border: rgba(255, 255, 255, 0.09);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11, 13, 18, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-badge {
      background: var(--accent);
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .search-box {
      flex: 1 1 260px;
      max-width: 420px;
      display: flex;
      gap: 8px;
    }

    input, select, button {
      font: inherit;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent-2);
    }

    input {
      width: 100%;
    }

    button {
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.12s ease, opacity 0.15s ease, background 0.15s ease;
    }

    button:hover {
      opacity: 0.92;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      white-space: nowrap;
    }

    .btn-ghost {
      background: var(--surface-2);
    }

    .container {
      max-width: 1320px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      gap: 24px;
    }

    .custom-link-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    @media (max-width: 640px) {
      .custom-link-bar {
        grid-template-columns: 1fr;
      }
    }

    .player-section {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 960px) {
      .player-section {
        grid-template-columns: 1fr;
      }
    }

    .player-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    .video-frame-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .video-frame-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .player-meta {
      padding: 16px 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .player-title {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .player-sub {
      color: var(--muted);
      font-size: 0.88rem;
      margin-top: 4px;
    }

    .queue-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 520px;
      overflow-y: auto;
    }

    .panel-heading {
      font-size: 0.98rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 0.85rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .chip.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.16s ease, border-color 0.16s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.22);
    }

    .thumb-wrap {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #0f131a;
      cursor: pointer;
      overflow: hidden;
    }

    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .play-pill {
      position: absolute;
      right: 10px;
      bottom: 10px;
      background: rgba(0, 0, 0, 0.78);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .card-body {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .card-title {
      font-size: 0.96rem;
      font-weight: 700;
      line-height: 1.35;
      cursor: pointer;
    }

    .card-cat {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .card-actions {
      margin-top: auto;
      display: flex;
      gap: 8px;
    }

    .card-actions button {
      flex: 1;
      padding: 8px 10px;
      font-size: 0.82rem;
    }

    .status-msg {
      font-size: 0.85rem;
      color: #fda4af;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>StreamTube</span>
      <span class="brand-badge">YT DIRECT</span>
    </div>

    <div class="search-box">
      <input id="searchInput" type="search" placeholder="Search videos or categories..." />
    </div>

    <button id="toggleSavedBtn" class="btn-ghost">Saved (0)</button>
  </header>

  <main class="container">
    <!-- Direct YouTube Link Launcher -->
    <section class="custom-link-bar" aria-label="Direct YouTube URL Player">
      <div>
        <input
          id="ytUrlInput"
          type="text"
          placeholder="Paste any YouTube link (e.g. https://youtu.be/... or watch?v=...) and hit Play"
        />
        <div id="linkStatus" class="status-msg"></div>
      </div>
      <button id="playLinkBtn" class="btn-primary">Play Link</button>
    </section>

    <!-- Main Player + Up Next -->
    <section class="player-section">
      <div class="player-card">
        <div class="video-frame-wrap">
          <iframe
            id="ytPlayer"
            src=""
            title="YouTube Stream Player"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
          ></iframe>
        </div>
        <div class="player-meta">
          <div>
            <div id="nowTitle" class="player-title">Select or paste a YouTube video</div>
            <div id="nowMeta" class="player-sub">Direct YouTube Embed Stream</div>
          </div>
          <div style="display:flex; gap:8px;">
            <button id="saveCurrentBtn" class="btn-ghost">Save Video</button>
            <a id="openYtLink" href="https://youtube.com" target="_blank" rel="noopener noreferrer">
              <button type="button" class="btn-ghost">Watch on YouTube</button>
            </a>
          </div>
        </div>
      </div>

      <aside class="queue-panel">
        <div class="panel-heading">
          <span>Up Next</span>
          <span id="queueCount" style="color:var(--muted); font-size:0.82rem;"></span>
        </div>
        <div id="upNextList" style="display:flex; flex-direction:column; gap:10px;"></div>
      </aside>
    </section>

    <!-- Category Filters -->
    <section class="filters" id="filterBar"></section>

    <!-- Video Catalog Grid -->
    <section class="grid" id="catalogGrid"></section>
  </main>

  <script>
    const STORAGE_KEY = "streamtube_saved_v1";

    // Replace or add any YouTube video IDs you want in your default catalog
    const CATALOG = [
      {
        id: "aqz-KE-bpKQ",
        title: "Big Buck Bunny 60fps 4K Showcase",
        category: "Animation",
        duration: "10:34"
      },
      {
        id: "LXb3EKWsInQ",
        title: "Costa Rica in 4K 60fps HDR Nature",
        category: "4K Scenery",
        duration: "05:14"
      },
      {
        id: "ysz5S6PUM-U",
        title: "Web & Tech Demo Highlight Reel",
        category: "Tech",
        duration: "01:12"
      },
      {
        id: "jfKfPfyJRdk",
        title: "Lofi Hip Hop Radio — Beats to Relax/Study",
        category: "Music",
        duration: "LIVE"
      },
      {
        id: "EngW7tLk6R8",
        title: "Cinematic Drone Aerials & Night City",
        category: "4K Scenery",
        duration: "04:08"
      },
      {
        id: "tgbNymZ7vqY",
        title: "Classic Comedy & Musical Short",
        category: "Entertainment",
        duration: "03:27"
      }
    ];

    let state = {
      activeCategory: "All",
      searchQuery: "",
      showSavedOnly: false,
      currentVideo: CATALOG[0],
      savedIds: loadSaved()
    };

    const els = {
      ytPlayer: document.getElementById("ytPlayer"),
      nowTitle: document.getElementById("nowTitle"),
      nowMeta: document.getElementById("nowMeta"),
      openYtLink: document.getElementById("openYtLink"),
      saveCurrentBtn: document.getElementById("saveCurrentBtn"),
      toggleSavedBtn: document.getElementById("toggleSavedBtn"),
      ytUrlInput: document.getElementById("ytUrlInput"),
      playLinkBtn: document.getElementById("playLinkBtn"),
      linkStatus: document.getElementById("linkStatus"),
      searchInput: document.getElementById("searchInput"),
      filterBar: document.getElementById("filterBar"),
      catalogGrid: document.getElementById("catalogGrid"),
      upNextList: document.getElementById("upNextList"),
      queueCount: document.getElementById("queueCount")
    };

    function loadSaved() {
      try {
        const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(raw) ? raw : [];
      } catch {
        return [];
      }
    }

    function persistSaved() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.savedIds));
      updateSavedButton();
    }

    function updateSavedButton() {
      els.toggleSavedBtn.textContent = `Saved (${state.savedIds.length})`;
      const isSaved = state.currentVideo && state.savedIds.includes(state.currentVideo.id);
      els.saveCurrentBtn.textContent = isSaved ? "Saved ✓" : "Save Video";
    }

    function extractYouTubeId(input) {
      const trimmed = (input || "").trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;

      try {
        const url = new URL(trimmed);
        if (url.hostname.includes("youtu.be")) {
          const id = url.pathname.replace("/", "").split("/")[0];
          return /^[a-zA-Z0-9_-]{11}$/.test(id) ? id : null;
        }
        if (url.hostname.includes("youtube.com")) {
          const v = url.searchParams.get("v");
          if (v && /^[a-zA-Z0-9_-]{11}$/.test(v)) return v;

          const parts = url.pathname.split("/").filter(Boolean);
          const embedIdx = parts.findIndex((p) => p === "embed" || p === "shorts" || p === "live");
          if (embedIdx !== -1 && parts[embedIdx + 1] && /^[a-zA-Z0-9_-]{11}$/.test(parts[embedIdx + 1])) {
            return parts[embedIdx + 1];
          }
        }
      } catch {
        return null;
      }
      return null;
    }

    function playVideo(video, autoplay = true) {
      if (!video || !video.id) return;
      state.currentVideo = video;
      const params = new URLSearchParams({
        rel: "0",
        modestbranding: "1",
        autoplay: autoplay ? "1" : "0"
      });
      els.ytPlayer.src = `https://www.youtube.com/embed/${encodeURIComponent(video.id)}?${params.toString()}`;
      els.nowTitle.textContent = video.title;
      els.nowMeta.textContent = `${video.category || "Direct Link"} • YouTube ID: ${video.id}`;
      els.openYtLink.href = `https://www.youtube.com/watch?v=${encodeURIComponent(video.id)}`;
      updateSavedButton();
      renderUpNext();
    }

    function toggleSaveVideo(videoId) {
      if (!videoId) return;
      if (state.savedIds.includes(videoId)) {
        state.savedIds = state.savedIds.filter((id) => id !== videoId);
      } else {
        state.savedIds.unshift(videoId);
      }
      persistSaved();
      renderCatalog();
    }

    function getFilteredCatalog() {
      return CATALOG.filter((item) => {
        const matchesCat = state.activeCategory === "All" || item.category === state.activeCategory;
        const q = state.searchQuery.toLowerCase().trim();
        const matchesSearch =
          !q ||
          item.title.toLowerCase().includes(q) ||
          item.category.toLowerCase().includes(q);
        const matchesSaved = !state.showSavedOnly || state.savedIds.includes(item.id);
        return matchesCat && matchesSearch && matchesSaved;
      });
    }

    function renderFilters() {
      const categories = ["All", ...new Set(CATALOG.map((c) => c.category))];
      els.filterBar.innerHTML = "";
      categories.forEach((cat) => {
        const btn = document.createElement("button");
        btn.className = `chip ${state.activeCategory === cat && !state.showSavedOnly ? "active" : ""}`;
        btn.textContent = cat;
        btn.addEventListener("click", () => {
          state.showSavedOnly = false;
          state.activeCategory = cat;
          renderFilters();
          renderCatalog();
        });
        els.filterBar.appendChild(btn);
      });
    }

    function renderCatalog() {
      const list = getFilteredCatalog();
      els.catalogGrid.innerHTML = "";

      if (!list.length) {
        els.catalogGrid.innerHTML = `<p style="color:var(--muted);">Koi video match nahi hua.</p>`;
        return;
      }

      list.forEach((video) => {
        const isSaved = state.savedIds.includes(video.id);
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <div class="thumb-wrap" data-play="${video.id}">
            <img src="https://img.youtube.com/vi/${video.id}/hqdefault.jpg" alt="${video.title}" loading="lazy" />
            <span class="play-pill">${video.duration || "PLAY"}</span>
          </div>
          <div class="card-body">
            <div class="card-title" data-play="${video.id}">${video.title}</div>
            <div class="card-cat">${video.category}</div>
            <div class="card-actions">
              <button class="btn-primary" data-play="${video.id}">Play</button>
              <button class="btn-ghost" data-save="${video.id}">${isSaved ? "Saved" : "Save"}</button>
            </div>
          </div>
        `;

        card.querySelectorAll("[data-play]").forEach((el) => {
          el.addEventListener("click", () => playVideo(video, true));
        });
        card.querySelector(`[data-save="${video.id}"]`).addEventListener("click", () => {
          toggleSaveVideo(video.id);
        });

        els.catalogGrid.appendChild(card);
      });
    }

    function renderUpNext() {
      const queue = CATALOG.filter((v) => v.id !== (state.currentVideo && state.currentVideo.id));
      els.queueCount.textContent = `${queue.length} videos`;
      els.upNextList.innerHTML = "";

      queue.forEach((video) => {
        const row = document.createElement("div");
        row.style.cssText =
          "display:grid; grid-template-columns:104px 1fr; gap:10px; align-items:center; cursor:pointer; padding:6px; border-radius:10px; background:var(--surface-2);";
        row.innerHTML = `
          <img src="https://img.youtube.com/vi/${video.id}/mqdefault.jpg" alt="${video.title}" style="width:104px; aspect-ratio:16/9; object-fit:cover; border-radius:8px;" />
          <div>
            <div style="font-size:0.88rem; font-weight:600; line-height:1.3;">${video.title}</div>
            <div style="font-size:0.75rem; color:var(--muted); margin-top:4px;">${video.category}</div>
          </div>
        `;
        row.addEventListener("click", () => playVideo(video, true));
        els.upNextList.appendChild(row);
      });
    }

    function handleCustomLinkPlay() {
      els.linkStatus.textContent = "";
      const raw = els.ytUrlInput.value;
      const id = extractYouTubeId(raw);
      if (!id) {
        els.linkStatus.textContent = "Valid YouTube link ya 11-char video ID daalein.";
        return;
      }
      playVideo(
        {
          id,
          title: `Custom YouTube Stream (${id})`,
          category: "Custom Link"
        },
        true
      );
    }

    els.playLinkBtn.addEventListener("click", handleCustomLinkPlay);
    els.ytUrlInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleCustomLinkPlay();
    });

    els.searchInput.addEventListener("input", (e) => {
      state.searchQuery = e.target.value;
      renderCatalog();
    });

    els.saveCurrentBtn.addEventListener("click", () => {
      if (state.currentVideo) toggleSaveVideo(state.currentVideo.id);
    });

    els.toggleSavedBtn.addEventListener("click", () => {
      state.showSavedOnly = !state.showSavedOnly;
      els.toggleSavedBtn.classList.toggle("active", state.showSavedOnly);
      renderFilters();
      renderCatalog();
    });

    // Init
    updateSavedButton();
    renderFilters();
    renderCatalog();
    playVideo(CATALOG[0], false);
  </script>
</body>
</html>
